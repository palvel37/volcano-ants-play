<!doctype html>
<html lang="ru">
<head>

<script>window.__tOpen = performance.now();</script>
<style>
  :root { --bg:#120c0a; --panel:#1d1512; --chip:#2b201b; --chip-on:#d9822b; --text:#f1e6dc; --dim:#a8968a; --ok:#7bd17b; --warn:#f0b04a; --bad:#ff6b5b; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text); font:13px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; overflow:hidden; }
  body { display:flex; flex-direction:column; height:100dvh; }
  #top { height:40px; flex:none; display:flex; align-items:center; gap:8px; padding:0 10px; background:var(--panel); border-bottom:1px solid #000; }
  #top b { font-size:14px; }
  #mode { margin-left:auto; padding:3px 8px; border-radius:10px; font-size:11px; font-weight:700; background:#333; }
  #mode.act { background:#8a3d12; } #mode.idle { background:#2e3b52; }
  #field { flex:1; position:relative; overflow:hidden; touch-action:none; }
  #field canvas { position:absolute; left:0; top:0; display:block; }
  #stats { position:absolute; left:4px; top:4px; padding:4px 6px; background:rgba(0,0,0,.66); border-radius:6px; font:10.5px/1.32 ui-monospace,Menlo,Consolas,monospace; white-space:pre; pointer-events:auto; max-width:calc(100% - 8px); overflow:hidden; }
  #stats.small { height:16px; }
  #banner { position:absolute; left:0; right:0; bottom:8px; text-align:center; pointer-events:none; }
  #banner span { display:inline-block; background:rgba(0,0,0,.75); padding:4px 10px; border-radius:10px; font-weight:700; }
  #panel { flex:none; background:var(--panel); border-top:1px solid #000; padding:6px 8px calc(6px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:5px; }
  .row { display:flex; align-items:center; gap:5px; flex-wrap:nowrap; overflow-x:auto; }
  .row label { width:62px; flex:none; color:var(--dim); font-size:11.5px; }
  .chip { flex:none; border:0; border-radius:8px; padding:6px 9px; background:var(--chip); color:var(--text); font:600 12px system-ui,sans-serif; }
  .chip.on { background:var(--chip-on); color:#1a0f08; }
  #autotest { margin-top:2px; border:0; border-radius:10px; padding:11px; background:#e8a13a; color:#1a0f08; font:800 15px system-ui,sans-serif; }
  #autotest:disabled { background:#5a4a3a; color:#cbb; }
  #modal { position:fixed; inset:0; background:rgba(0,0,0,.82); display:none; flex-direction:column; padding:12px; gap:8px; z-index:10; }
  #modal.show { display:flex; }
  #modal textarea { flex:1; width:100%; background:#0d0907; color:var(--text); border:1px solid #3a2a22; border-radius:8px; font:11px/1.35 ui-monospace,Menlo,Consolas,monospace; padding:8px; resize:none; }
  #modal .btns { display:flex; gap:8px; } #modal .btns button { flex:1; padding:11px; border:0; border-radius:10px; font:700 14px system-ui,sans-serif; background:var(--chip); color:var(--text); }
  #modal .btns button.main { background:#e8a13a; color:#1a0f08; }
  #err { position:fixed; left:8px; right:8px; top:48px; background:#5b1010; color:#fff; padding:8px; border-radius:8px; display:none; font-size:12px; white-space:pre-wrap; z-index:20; }
</style>

<body>
<div id="top"><b>Спайк рендера</b><span style="color:var(--dim);font-size:11px">PixiJS 8.22 · §8</span><span id="mode">…</span></div>
<div id="field"><div id="stats">загрузка…</div><div id="banner"></div></div>
<div id="panel">
  <div class="row"><label>Качество</label><button class="chip" data-k="quality" data-v="high">Высокое</button><button class="chip" data-k="quality" data-v="low">Низкое</button>
    <span style="width:8px"></span><button class="chip" data-k="zoom" data-v="9">9 клеток</button><button class="chip" data-k="zoom" data-v="13">13 клеток</button></div>
  <div class="row"><label>Частицы</label><button class="chip" data-k="particles" data-v="0">0</button><button class="chip" data-k="particles" data-v="60">60</button><button class="chip" data-k="particles" data-v="150">150</button><button class="chip" data-k="particles" data-v="300">300</button></div>

    <span style="width:8px"></span><button class="chip" data-k="scene" data-v="idle">Покой</button><button class="chip" data-k="scene" data-v="action">Действие</button></div>

</div>
<div id="modal"><b>Сводка автотеста — сделайте скриншот или скопируйте</b><textarea id="summary" readonly></textarea>

<div id="err"></div>

<script src="https://cdn.jsdelivr.net/npm/pixi.js@8.22.0/dist/pixi.min.js"></script>
<script>
'use strict';
// ============================================================================
// Спайк рендера Volcano Ants. Прототип: выбросить после замеров (см. README.md).
// ============================================================================
const PIXI_URL = 'https://cdn.jsdelivr.net/npm/pixi.js@8.22.0/dist/pixi.min.js';
const A = 'render-assets/';
const P = window.PIXI;
const $ = (s) => document.querySelector(s);
const showErr = (m) => { const e = $('#err'); e.style.display = 'block'; e.textContent += m + '\n'; };
window.addEventListener('error', (e) => showErr('Ошибка: ' + e.message));
window.addEventListener('unhandledrejection', (e) => showErr('Ошибка: ' + (e.reason && e.reason.message || e.reason)));

const DPR = window.devicePixelRatio || 1;
const CELL = 48;                // клетка в «точках» мира (= 96 px атласа при resolution 2)
const W = 40, H = 200;          // поле 40×200 клеток, как в арт-библии §8.2
const S = { quality: 'high', zoom: 13, particles: 150, res: 'auto', fog: true, vignette: true, scene: 'action' };

// Детерминированный ГПСЧ — чтобы прогоны автотеста были одинаковыми (только для прототипа).
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let rand = mulberry32(7);
const ri = (a, b) => a + Math.floor(rand() * (b - a + 1));

// ---------------------------------------------------------------- метрики
const M = {
  load: {}, decode: {}, gpuProbe: null,
  intervals: [], cpu: [], times: [],   // кольцо за последние ~10 с
  drawCalls: 0, lastDrawCalls: 0, sprites: 0, overdraw: 0,
  phase: null,
};
function pushFrame(now, dt, cpu) {
  M.times.push(now); M.intervals.push(dt); M.cpu.push(cpu);
  while (M.times.length && now - M.times[0] > 10000) { M.times.shift(); M.intervals.shift(); M.cpu.shift(); }
  if (M.phase && M.phase.collect && now > M.phase.warmUntil) { M.phase.iv.push(dt); M.phase.cpu.push(cpu); M.phase.dc.push(M.lastDrawCalls); }
}
const pct = (arr, p) => { if (!arr.length) return 0; const s = [...arr].sort((a, b) => a - b); return s[Math.min(s.length - 1, Math.floor(p * (s.length - 1)))]; };
const avg = (arr) => arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : 0;
function fpsStats(iv) {
  if (!iv.length) return { avg: 0, low1: 0 };
  return { avg: 1000 / avg(iv), low1: 1000 / pct(iv, 0.99) };
}

// ---------------------------------------------------------------- приложение
let app, gl, renderer;
const L = {}; // слои
const TX = { high: {}, low: {} }; // текстуры по имени кадра
const SRC = { high: [], low: [] }; // источники (для памяти)
let atlasMeta;

async function fetchBitmap(file, res) {
  const t0 = performance.now();
  const r = await fetch(A + file);
  if (!r.ok) throw new Error('не загрузился ' + file);
  const blob = await r.blob();
  const t1 = performance.now();
  const bmp = await createImageBitmap(blob);
  const t2 = performance.now();
  const source = new P.ImageSource({ resource: bmp, resolution: res, scaleMode: 'linear' });
  return { source, bytes: blob.size, fetchMs: t1 - t0, decodeMs: t2 - t1, w: bmp.width, h: bmp.height };
}

async function loadSet(set) {
  const res = set === 'high' ? 2 : 1;
  const suffix = set === 'high' ? '@2x' : '@1x';
  const pages = Object.keys(atlasMeta).filter((k) => k[0] !== '_');
  const t0 = performance.now();
  const loaded = await Promise.all(pages.map((p) => fetchBitmap(`atlas_${p}${suffix}.webp`, res)));
  let bytes = 0, decodeMax = 0;
  pages.forEach((p, i) => {
    const { source } = loaded[i];
    bytes += loaded[i].bytes; decodeMax = Math.max(decodeMax, loaded[i].decodeMs);
    SRC[set].push({ name: p, px: loaded[i].w * loaded[i].h, source });
    for (const [name, f] of Object.entries(atlasMeta[p].frames)) {
      TX[set][name] = new P.Texture({ source, frame: new P.Rectangle(f[0] / 2, f[1] / 2, f[2] / 2, f[3] / 2) });
    }
  });
  return { ms: performance.now() - t0, bytes, decodeMax };
}
const tex = (name) => TX[S.quality === 'low' && TX.low[name] ? 'low' : 'high'][name];

async function boot() {
  const pixiRes = performance.getEntriesByName(PIXI_URL)[0];
  M.load.pixiMs = pixiRes ? pixiRes.duration : null;
  M.load.pixiKB = pixiRes && pixiRes.transferSize ? pixiRes.transferSize / 1024 : null;
  M.load.pixiEnd = pixiRes ? pixiRes.responseEnd : null;

  const field = $('#field');
  app = new P.Application();
  await app.init({
    width: field.clientWidth, height: field.clientHeight, resolution: currentRes(), autoDensity: true,
    preference: 'webgl', antialias: false, background: '#120c0a', backgroundAlpha: 1,
    autoStart: false, sharedTicker: false, powerPreference: 'high-performance',
  });
  app.ticker.stop();
  field.prepend(app.canvas);
  renderer = app.renderer;
  gl = renderer.gl;
  hookDrawCalls();

  const tA = performance.now();
  atlasMeta = await (await fetch(A + 'atlas.json')).json();
  const env = await Promise.all(['env_lava_surface@2x.webp', 'env_lava_glow@2x.webp', 'env_vignette@2x.webp'].map((f) => fetchBitmap(f, 2)));
  const hi = await loadSet('high');
  env.forEach((e, i) => { SRC.high.push({ name: 'env' + i, px: e.w * e.h, source: e.source }); });
  TX.env = env.map((e) => new P.Texture({ source: e.source }));
  M.load.atlasMs = performance.now() - tA;
  M.load.atlasKB = (hi.bytes + env.reduce((a, e) => a + e.bytes, 0)) / 1024;
  M.load.decodeMax = hi.decodeMax;

  buildMap();
  buildScene();
  resize();
  window.addEventListener('resize', () => { resize(); });
  setupInput();
  setupUI();
  requestAnimationFrame(frame);
}

// --------------------------------------------- подсчёт вызовов отрисовки
function hookDrawCalls() {
  for (const fn of ['drawElements', 'drawArrays', 'drawElementsInstanced', 'drawArraysInstanced']) {
    const orig = gl[fn];
    if (typeof orig !== 'function') continue;
    gl[fn] = function () { M.drawCalls++; return orig.apply(this, arguments); };
  }
}
function glInfo() {
  const dbg = gl.getExtension('WEBGL_debug_renderer_info');
  return {
    webgl: (typeof WebGL2RenderingContext !== 'undefined' && gl instanceof WebGL2RenderingContext) ? 2 : 1,
    gpu: dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER),
    units: gl.getParameter(gl.MAX_TEXTURE_IMAGE_UNITS),
    maxTex: gl.getParameter(gl.MAX_TEXTURE_SIZE),
    batchable: renderer.limits ? renderer.limits.maxBatchableTextures : '?',
    timerExt: !!(gl.getExtension('EXT_disjoint_timer_query_webgl2') || gl.getExtension('EXT_disjoint_timer_query')),
  };
}

// ---------------------------------------------------------------- карта
const T = { SOFT: 0, HARD: 1, TUN: 2, IRON: 3, WALL: 4, FLOOR: 5 };
const grid = new Uint8Array(W * H), vari = new Uint8Array(W * H), cryst = new Int8Array(W * H).fill(-1);
const fogState = new Uint8Array(W * H); // 0 неизвестно, 1 разведано, 2 видно
const zones = []; let route = [];
const at = (x, y) => (x < 0 || y < 0 || x >= W || y >= H) ? T.HARD : grid[y * W + x];
const COLORS = ['red', 'blue', 'purple', 'yellow'], SIZES = ['small', 'mid', 'big'];

function buildMap() {
  rand = mulberry32(7);
  for (let i = 0; i < W * H; i++) { grid[i] = rand() < 0.28 ? T.HARD : T.SOFT; vari[i] = ri(0, 255); }
  for (let y = 10; y < H; y += ri(11, 15)) {      // перегородки из железа с проходами
    const gap = ri(3, W - 6);
    for (let x = 0; x < W; x++) if (x < gap || x > gap + 3) grid[y * W + x] = T.IRON;
  }
  for (let k = 0; k < 26; k++) {                   // комнаты
    const rx = ri(1, W - 8), ry = ri(4, H - 8), rw = ri(5, 7), rh = ri(4, 5);
    for (let y = ry; y < ry + rh; y++) for (let x = rx; x < rx + rw; x++)
      grid[y * W + x] = (x === rx || y === ry || x === rx + rw - 1 || y === ry + rh - 1) ? T.WALL : T.FLOOR;
  }
  for (let k = 0; k < 30; k++) {                   // старые туннели
    let x = ri(0, W - 1), y = ri(0, H - 1);
    for (let s = 0; s < 30; s++) { if (grid[y * W + x] <= T.HARD) grid[y * W + x] = T.TUN; if (rand() < 0.5) x = Math.max(0, Math.min(W - 1, x + (rand() < 0.5 ? -1 : 1))); else y = Math.max(0, Math.min(H - 1, y + 1)); }
  }
  for (let i = 0; i < W * H; i++) if (grid[i] <= T.HARD && rand() < 0.07) cryst[i] = ri(0, 3) * 3 + (rand() < 0.6 ? 0 : rand() < 0.7 ? 1 : 2);
  for (let y = 6; y < H - 4; y += ri(9, 14)) zones.push({ x: ri(1, W - 5), y, w: 3, h: 3 });
  // маршрут муравья: вниз, обходя железо и стены
  route = []; let x = 20, y = 1; route.push([x, y]);
  let dir = 1;
  while (y < H - 3 && route.length < 2000) {
    const down = at(x, y + 1);
    if (down !== T.IRON && down !== T.WALL && rand() < 0.75) y++;
    else { if (at(x + dir, y) === T.IRON || at(x + dir, y) === T.WALL || x + dir < 1 || x + dir > W - 2) dir = -dir; x += dir; }
    route.push([x, y]);
  }
  // туман: всё неизвестно, кое-где разведано
  fogState.fill(0);
  for (const [rx, ry] of route) for (let yy = ry - 4; yy <= ry + 4; yy++) for (let xx = rx - 4; xx <= rx + 4; xx++) if (xx >= 0 && yy >= 0 && xx < W && yy < H && rand() < 0.8) fogState[yy * W + xx] = 1; // муравей «уже ходил» рядом
  for (let k = 0; k < 40; k++) { const cx = ri(0, W - 1), cy = ri(0, H - 1), r = ri(2, 4); for (let yy = cy - r; yy <= cy + r; yy++) for (let xx = cx - r; xx <= cx + r; xx++) if (xx >= 0 && yy >= 0 && xx < W && yy < H) fogState[yy * W + xx] = 1; }
}

function tileName(x, y) {
  const t = at(x, y), v = vari[y * W + x];
  switch (t) {
    case T.SOFT: return 'tile_rock_soft_' + String(v % 24).padStart(2, '0');
    case T.HARD: return 'tile_rock_hard_' + String(v % 16).padStart(2, '0');
    case T.TUN: return 'tile_tunnel_' + String(v % 12).padStart(2, '0');
    case T.IRON: return 'tile_iron_' + String(v % 12).padStart(2, '0');
    case T.WALL: { const m = (at(x, y - 1) === T.FLOOR ? 1 : 0) | (at(x + 1, y) === T.FLOOR ? 2 : 0) | (at(x, y + 1) === T.FLOOR ? 4 : 0) | (at(x - 1, y) === T.FLOOR ? 8 : 0); return 'tile_room_wall_' + String(m).padStart(2, '0'); }
    default: return 'tile_room_floor_' + String(v % 8).padStart(2, '0');
  }
}
function depthTint(y) { // затемнение по глубине через tint (§8.9)
  const k = Math.min(1, y / H) * 0.45;
  const r = Math.round(255 * (1 - k)), g = Math.round(255 * (1 - k * 1.25)), b = Math.round(255 * (1 - k * 1.35));
  return (r << 16) | (g << 8) | b;
}

// ---------------------------------------------------------------- сцена
let cellCss = 30, cols = 13, rows = 22;
const cam = { x: 0, y: 0, dragUntil: 0 };
const pool = { tiles: [], crystals: [], halos: [], danger: [] };
let ant, antLamp, monsters = [], fogCanvas, fogCtx, fogTex, fogSprite, fogImg;
let lavaGlow, lava, vignette;
let addPC, normPC; const parts = { add: [], norm: [] };

function buildScene() {
  const st = app.stage;
  L.world = new P.Container(); st.addChild(L.world);
  L.tiles = new P.Container(); L.items = new P.Container(); L.chars = new P.Container();
  normPC = new P.ParticleContainer({ dynamicProperties: { position: true, rotation: true, vertex: true, color: true, uvs: true } });
  L.add = new P.Container(); L.add.blendMode = 'add';
  addPC = new P.ParticleContainer({ dynamicProperties: { position: true, rotation: true, vertex: true, color: true, uvs: true } });
  addPC.blendMode = 'add';
  L.world.addChild(L.tiles, L.items, L.chars, normPC, L.add);
  L.halos = new P.Container(); L.add.addChild(L.halos); L.add.addChild(addPC);

  // туман: 1 пиксель = 1 клетка (§8.9)
  fogCanvas = document.createElement('canvas'); fogCanvas.width = W; fogCanvas.height = H;
  fogCtx = fogCanvas.getContext('2d'); fogImg = fogCtx.createImageData(W, H);
  fogTex = P.Texture.from(fogCanvas); fogTex.source.scaleMode = 'linear';
  fogSprite = new P.Sprite(fogTex); fogSprite.width = W * CELL; fogSprite.height = H * CELL;
  L.world.addChild(fogSprite);
  redrawFog();

  // муравей и монстры
  ant = { s: new P.Sprite(tex('hero_idle_00')), x: route[0][0], y: route[0][1], idx: 0, state: 'walk', t: 0, dir: 1, frameT: 0, hurt: 0 };
  ant.s.anchor.set(0.5, 0.97); L.chars.addChild(ant.s);
  revealAround(ant.x, ant.y);
  antLamp = new P.Sprite(tex('fx_lamp_cone')); antLamp.anchor.set(0.15, 0.5); L.add.addChildAt(antLamp, 0);
  const defs = [['guard', 3, -1, 0.67], ['crawler', -3, 1, 0.75], ['spiker', 2, 3, 0.75], ['biter', -2, -3, 0.75]];
  monsters = defs.map(([kind, ox, oy, sc], i) => {
    const s = new P.Sprite(tex(`mon_${kind}_idle_00`)); s.anchor.set(0.5, 0.97); s.scale.set(sc); L.chars.addChild(s);
    return { kind, s, ox, oy, sc, x: ant.x + ox, y: ant.y + oy, phase: i * 1.7, attackT: 0, frameT: rand() };
  });

  // экранный слой: свечение лавы (add), поверхность лавы, виньетка
  L.screen = new P.Container(); st.addChild(L.screen);
  lavaGlow = new P.Sprite(TX.env[1]); lavaGlow.blendMode = 'add';
  lava = new P.TilingSprite({ texture: TX.env[0], width: 100, height: 40 });
  vignette = new P.Sprite(TX.env[2]);
  L.screen.addChild(lavaGlow, lava, vignette);
  L.probe = new P.Container(); st.addChild(L.probe); // для замера загрузки текстур в GPU
}

function currentRes() {
  if (S.res !== 'auto') return +S.res;
  return S.quality === 'low' ? Math.min(DPR, 1.5) : Math.min(DPR, 2);
}

function resize() {
  const f = $('#field');
  const w = f.clientWidth, h = f.clientHeight;
  renderer.resize(w, h, currentRes());
  cols = S.zoom; cellCss = w / cols; rows = Math.ceil(h / cellCss);
  L.world.scale.set(cellCss / CELL);
  const needT = (cols + 2) * (rows + 2);
  while (pool.tiles.length < needT) { const s = new P.Sprite(tex('tile_rock_soft_00')); L.tiles.addChild(s); pool.tiles.push(s); }
  pool.tiles.forEach((s, i) => { s.visible = i < needT; });
  const lavaH = Math.round(cellCss * 1.1);
  lava.width = w; lava.height = lavaH; lava.y = h - lavaH; lava.tileScale.set(lavaH / 128);
  lavaGlow.width = w; lavaGlow.height = cellCss * 3; lavaGlow.y = h - lavaH - cellCss * 3 + 4;
  vignette.width = w; vignette.height = h;
  lastOrigin = null;
}

let lastOrigin = null, mapDirty = true;
function refreshPools() {
  const ox = Math.floor(cam.x) - 1, oy = Math.floor(cam.y) - 1;
  const key = ox + ',' + oy + ',' + cols + ',' + S.quality;
  if (key === lastOrigin && !mapDirty) return;
  lastOrigin = key; mapDirty = false;
  const cw = cols + 2, ch = rows + 2;
  let i = 0, ci = 0, di = 0;
  for (let y = oy; y < oy + ch; y++) for (let x = ox; x < ox + cw; x++) {
    const s = pool.tiles[i++];
    if (x < 0 || y < 0 || x >= W || y >= H) { s.visible = false; continue; }
    s.visible = true; s.texture = tex(tileName(x, y)); s.position.set(x * CELL, y * CELL); s.width = CELL; s.height = CELL; s.tint = depthTint(y);
    const c = cryst[y * W + x];
    if (c >= 0) {
      if (ci >= pool.crystals.length) {

  gi = gi || glInfo();
  const mem = memInfo(); const d = M.decode;
  const act = R.filter((r) => r.target === 60), idle = R.find((r) => /покой/.test(r.name)), low = R.find((r) => /Низкое/.test(r.name));
  const minAct = Math.min(...act.map((r) => r.low1)), avgAct = avg(act.map((r) => r.fps));
  const maxDC = Math.max(...R.map((r) => r.dc)), maxSpr = Math.max(...R.filter((r) => !/стресс/.test(r.name)).map((r) => r.sprites));
  const maxCpu = Math.max(...R.filter((r) => !/стресс/.test(r.name)).map((r) => r.cpu)), maxOd = Math.max(...R.map((r) => r.od));
  const g = M.gpuProbe || {};
  const fogVig = g['всё'] != null ? g['всё'] - g['без тумана и виньетки'] : null;
  const L1 = [];
  L1.push('Volcano Ants · спайк рендера v1 · PixiJS 8.22.0 · ' + new Date().toISOString().slice(0, 16).replace('T', ' '));
  L1.push('Устройство: ' + navigator.userAgent);
  L1.push(`Экран ${innerWidth}×${innerHeight} CSS, DPR ${DPR}, поле ${renderer.width}×${renderer.height} CSS (${app.canvas.width}×${app.canvas.height} px), deviceMemory ${navigator.deviceMemory || 'н/д'} ГБ, ядер ${navigator.hardwareConcurrency || 'н/д'}`);
  L1.push(`GPU: ${gi.gpu} · WebGL${gi.webgl} · MAX_TEXTURE_IMAGE_UNITS ${gi.units} · батч Pixi ${gi.batchable} · MAX_TEXTURE_SIZE ${gi.maxTex} · таймер GPU ${gi.timerExt ? 'есть' : 'нет'}`);
  L1.push('');
  L1.push('Загрузка:');
  L1.push(`  pixi.min.js ${M.load.pixiKB ? M.load.pixiKB.toFixed(0) + ' КБ' : '(из кэша)'} за ${M.load.pixiMs != null ? M.load.pixiMs.toFixed(0) : '?'} мс`);
  L1.push(`  атласы @2x + env: ${M.load.atlasKB.toFixed(0)} КБ за ${M.load.atlasMs.toFixed(0)} мс (декод страницы ≤ ${M.load.decodeMax.toFixed(0)} мс)`);
  L1.push(`  первый кадр через ${(M.load.firstFrame / 1000).toFixed(2)} с от открытия страницы`);
  if (d.d1024) L1.push(`  WebP 1024² (${d.d1024.kb.toFixed(0)} КБ): декод ${d.d1024.dec.toFixed(1)} мс (img.decode ${d.d1024.decImg.toFixed(1)}), загрузка в GPU ${d.d1024.up.toFixed(1)} мс`);
  if (d.d2048) L1.push(`  WebP 2048² (${d.d2048.kb.toFixed(0)} КБ): декод ${d.d2048.dec.toFixed(1)} мс (img.decode ${d.d2048.decImg.toFixed(1)}), загрузка в GPU ${d.d2048.up.toFixed(1)} мс`);
  L1.push(`Память: текстуры @2x ${texMB('high').toFixed(1)} МБ (+@1x ${texMB('low').toFixed(1)} МБ)` + (mem ? `, JS heap ${mem.used.toFixed(0)}/${mem.total.toFixed(0)} МБ (лимит ${mem.limit.toFixed(0)})` : ', JS heap н/д'));
  L1.push('');
  L1.push('Фазы (FPS ср / 1% low · кадр CPU ср/p95 · draw calls · спрайты · частицы · перерисовка):');
  for (const r of R) L1.push(`  ${r.name} [цель ${r.target}]: ${r.fps.toFixed(1)} / ${r.low1.toFixed(1)} · ${r.cpu.toFixed(2)}/${r.cpu95.toFixed(2)} мс · DC ${r.dc} · ${r.sprites} · ${r.parts} · ${r.od.toFixed(2)}×`);
  if (M.gpuProbe) L1.push('GPU-проба (рендер+синхронизация, медиана, мс): ' + Object.entries(g).map(([k, v]) => `${k} ${v.toFixed(2)}`).join(' · '));
  L1.push('');
  L1.push('Сверка с §8:');
  L1.push(`  ${mark(minAct >= 30, minAct >= 25)} FPS при действии не ниже 30: 1% low ${minAct.toFixed(1)}, среднее ${avgAct.toFixed(1)} (цель 60)`);
  if (idle) L1.push(`  ${mark(Math.abs(idle.fps - 30) < 3, idle.fps > 25)} покой 30 FPS: ${idle.fps.toFixed(1)}`);
  if (low) L1.push(`  ${mark(low.low1 >= 27, low.low1 >= 22)} «Низкое» держит 30: 1% low ${low.low1.toFixed(1)}`);
  L1.push(`  ${mark(maxCpu <= 6, maxCpu <= 8)} кадр CPU ≤ 6 мс (потолок 8): ${maxCpu.toFixed(2)}`);
  L1.push(`  ${mark(maxDC <= 25, maxDC <= 50)} draw calls ≤ 25 (потолок 50): ${maxDC}`);
  L1.push(`  ${mark(maxSpr <= 1000, maxSpr <= 1500)} спрайтов ≤ 1000: ${maxSpr}`);
  L1.push(`  ${mark(maxOd <= 3, maxOd <= 4)} перерисовка ≤ 3× (потолок 4×), оценка: ${maxOd.toFixed(2)}×`);
  L1.push(`  ${mark(gi.units >= 16, gi.units >= 8)} текстурных слотов ≥ 8 страниц: ${gi.units}`);
  L1.push(`  ${mark(texMB('high') <= 32, texMB('high') <= 48)} текстуры экрана копания ≤ 32 МБ: ${texMB('high').toFixed(1)}`);
  if (fogVig != null) L1.push(`  ${mark(fogVig <= 2, fogVig <= 3)} туман+виньетка ≤ 2 мс GPU: ≈ ${fogVig.toFixed(2)} мс (разница в GPU-пробе)`);
  if (d.d2048) L1.push(`  ${mark(d.d2048.up <= 17, d.d2048.up <= 50)} догрузка страницы без подвисания (загрузка в GPU блокирует кадр, цель ≤ 17 мс): 1024² ${d.d1024.up.toFixed(0)} мс, 2048² ${d.d2048.up.toFixed(0)} мс; декод (в фоне) ${d.d1024.dec.toFixed(0)} / ${d.d2048.dec.toFixed(0)} мс`);
  L1.push(`  ${mark(M.load.firstFrame <= 3000, M.load.firstFrame <= 5000)} первый кадр ≤ 3 с: ${(M.load.firstFrame / 1000).toFixed(2)} с (сеть этого телефона, не 4G-троттлинг)`);
  return L1.join('\n');
}

// ---------------------------------------------------------------- ввод и кнопки
function setupInput() {
  const f = $('#field'); let drag = null;
  f.addEventListener('pointerdown', (e) => { if (e.target.id === 'stats') return; drag = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y }; f.setPointerCapture(e.pointerId); touch(); });
  f.addEventListener('pointermove', (e) => { if (!drag) return; cam.x = drag.cx - (e.clientX - drag.x) / cellCss; cam.y = drag.cy - (e.clientY - drag.y) / cellCss; cam.dragUntil = performance.now() + 2500; touch(); });
  f.addEventListener('pointerup', () => { drag = null; });
  f.addEventListener('pointercancel', () => { drag = null; });
  $('#stats').addEventListener('click', () => $('#stats').classList.toggle('small'));
}
function applySettings() {
  // текстуры: при смене качества переставить на @1x / @2x
  ant.s.texture = tex('hero_idle_00');
  for (const m of monsters) m.s.texture = tex(`mon_${m.kind}_idle_00`);
  antLamp.texture = tex('fx_lamp_cone');
  parts.add.length = 0; parts.norm.length = 0; particlesDirty = true; // частицы пересоздадутся с новой страницей
  resize();
  syncChips();
}
function syncChips() {
  document.querySelectorAll('.chip').forEach((b) => {
    const k = b.dataset.k, v = b.dataset.v;
    b.classList.toggle('on', v === 'toggle' ? !!S[k] : String(S[k]) === v);
  });
}
function setupUI() {
  document.querySelectorAll('.chip').forEach((b) => b.addEventListener('click', () => {
    if (autotest) return;
    const k = b.dataset.k, v = b.dataset.v;
    if (v === 'toggle') S[k] = !S[k];
    else S[k] = (k === 'zoom' || k === 'particles') ? +v : v;
    if (k === 'quality' && v === 'low' && !SRC.low.length) { showErr('@1x ещё грузится — повторите через секунду'); S.quality = 'high'; }
    if (k === 'scene') touch();
    applySettings();
  }));
  $('#autotest').addEventListener('click', startAutotest);
  $('#close').addEventListener('click', () => $('#modal').classList.remove('show'));
  $('#copy').addEventListener('click', async () => {
    const ta = $('#summary');
    try { await navigator.clipboard.writeText(ta.value); $('#copy').textContent = 'Скопировано ✓'; }
    catch (e) { ta.focus(); ta.select(); const ok = document.execCommand && document.execCommand('copy'); $('#copy').textContent = ok ? 'Скопировано ✓' : 'Выделено — скопируйте вручную'; }
  });
  syncChips();
}

window.__spike = { M, S, get summary() { return M.lastSummary; } };
if (!P) showErr('PixiJS не загрузился (нет сети до cdn.jsdelivr.net?)'); else boot();
</script>
